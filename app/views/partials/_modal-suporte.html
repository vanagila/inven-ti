<div class="modal fade" id="{{ modal_id or 'modalNovoSuporte' }}" tabindex="-1" aria-labelledby="{{ (modal_id or 'modalNovoSuporte') + 'Label' }}" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-semibold" id="{{ (modal_id or 'modalNovoSuporte') + 'Label' }}">Registrar Suporte</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>

            <form id="{{ (modal_id or 'modalNovoSuporte') + '-form' }}" method="POST" action="{{ action_url or url_for('registro_suporte.registrar_suporte') }}">
                <div class="modal-body">
                    <div class="row g-3">
                        <input type="hidden" name="id_equipamento" id="id_equipamento" value="{{ equipamento.id if equipamento else '' }}">
                        <div class="col-md-12 readonly-field">
                            <label class="form-label" for="equipamento">Equipamento</label>
                            <input type="text" class="form-control" id="id_equipamento" readonly value="{{ equipamento.patrimonio if equipamento else '' }}">
                        </div>

                        <div class="col-md-6">
                            <label for="data_suporte" class="form-label">Data do Suporte*</label>
                            <input type="date" class="form-control" id="data_suporte" name="data_suporte" value="{{ dados.data_suporte if dados else '' }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="tipo_suporte">Tipo de Suporte*</label>
                            <select class="form-select" id="tipo_suporte" name="tipo_suporte" required>
                                <option value="">Selecionar</option>
                                {% for tipo in tipos_suporte %}
                                    <option value="{{ tipo }}">{{ tipo }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="responsavel">Responsável*</label>
                            <input type="text" class="form-control" placeholder="Digite o nome do responsável" name="responsavel" id="responsavel" required value="">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="custo">Custo*</label>
                            <input type="number" class="form-control" placeholder="Digite o custo" name="custo" id="custo" required value="{{ dados.custo if dados else '0.00' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label" for="descricao">Descrição</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="4" cols="50" placeholder="Descreva o trabalho de suporte realizado" required>{{ dados.descricao if dados else '' }}</textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-dark">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
