<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema{% endblock %}</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <!-- Tema customizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/componentes.css') }}">
</head>
<body>
    {% block header %}{% endblock %}
    
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('senha');
            const icon = document.getElementById('toggleIcon');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let modalEditar = document.getElementById('modalEditar');
            if (!modalEditar) return;

            modalEditar.addEventListener('show.bs.modal', function (event) {
                let button = event.relatedTarget; // botão que abriu o modal
                // pegar dados do botão
                let form = document.getElementById('modalEditar-form');
                if (!form) return;

                // campos
                let fields = ['patrimonio','tipo','marca','modelo','numero_serie','localizacao','data_aquisicao','status','observacoes'];
                fields.forEach(function(name){
                    let el = form.querySelector('[name="'+name+'"]');
                    if (!el) return;
                    let val = button.getAttribute('data-'+name);
                    if (val === null) val = '';
                    if (el.tagName.toLowerCase() === 'select'){
                        // selecionar opção que bate com valor
                        for (let i=0;i<el.options.length;i++){
                            el.options[i].selected = (el.options[i].value === val) || (el.options[i].text === val);
                        }
                    } else {
                        el.value = val;
                    }
                });

                // setar action do form se o botão tiver data-update-url
                let updateUrl = button.getAttribute('data-update-url');
                if (updateUrl) {
                    form.action = updateUrl;
                }
            });
        });
    </script>
</body>
</html>
